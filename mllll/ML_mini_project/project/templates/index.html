<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockSense AI</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;
      --panel:#161b22;
      --panel-2:#0d1117;
      --panel-3:#21262d;
      --text:#e6edf3;
      --muted:#8b949e;
      --border:#30363d;
      --blue:#58a6ff;
      --green:#238636;
      --green-2:#2ea043;
      --green-soft:#0d2b1a;
      --green-text:#3fb950;
      --red:#da3633;
      --red-soft:#2b0d0d;
      --red-text:#f85149;
      --gold:#e3b341;
      --gold-bg:#9e6a03;
      --shadow:0 18px 40px rgba(1,4,9,.16);
    }
    body.light{
      --bg:#f5f7fb;
      --panel:#ffffff;
      --panel-2:#f8fafc;
      --panel-3:#eef2f7;
      --text:#111827;
      --muted:#5f6b7a;
      --border:#d8dee8;
      --blue:#0969da;
      --green:#1f883d;
      --green-2:#166534;
      --green-soft:#eaf7ee;
      --green-text:#1a7f37;
      --red:#cf222e;
      --red-soft:#fff1f1;
      --red-text:#cf222e;
      --gold:#8a5a00;
      --gold-bg:#fff4cc;
      --shadow:0 18px 42px rgba(17,24,39,.08);
    }
    body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:32px 16px;transition:background .2s ease,color .2s ease}
    header{text-align:center;margin-bottom:36px}
    header h1{font-size:1.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px}
    header p{color:var(--muted);margin-top:8px;font-size:.92rem}
    .theme-toggle{position:fixed;top:22px;right:22px;z-index:20;display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
    .theme-toggle:hover{border-color:var(--blue)}
    .theme-toggle:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
    .theme-toggle .sun,.theme-toggle .moon{width:18px;height:18px}
    .theme-toggle .sun{display:none}
    body.light .theme-toggle .sun{display:block}
    body.light .theme-toggle .moon{display:none}
    .t-icon{background:#cc0000;border-radius:8px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center}
    .t-icon svg{width:22px;height:22px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 32px;max-width:560px;margin:0 auto 36px;box-shadow:var(--shadow)}
    .card h2{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:20px}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .field{flex:1;min-width:140px}
    .field label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .field select,.field input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-size:.92rem;outline:none}
    .field select:focus,.field input:focus{border-color:var(--blue)}
    .field select option{background:var(--panel)}
    .btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
    .btn:hover{background:var(--green-2)}
    .btn:disabled{background:var(--panel-3);color:var(--muted);cursor:not-allowed}
    .spinner{display:none;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:14px auto 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .err{margin-top:14px;padding:12px 16px;background:var(--red-soft);border:1px solid var(--red);border-radius:8px;color:var(--red-text);font-size:.85rem;display:none}
    #res{display:none;max-width:1100px;margin:0 auto}
    .sbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px}
    .chip{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 18px;text-align:center}
    .chip .cl{font-size:.68rem;color:var(--muted);text-transform:uppercase}
    .chip .cv{font-size:1.05rem;font-weight:700;margin-top:2px}
    .chip.up{border-color:var(--green)}.chip.up .cv{color:var(--green-text)}
    .chip.dn{border-color:var(--red)}.chip.dn .cv{color:var(--red-text)}
    .pills{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
    .pill{padding:9px 20px;border-radius:999px;font-size:.9rem;font-weight:700}
    .pup{background:var(--green-soft);border:1px solid var(--green);color:var(--green-text)}
    .pdn{background:var(--red-soft);border:1px solid var(--red);color:var(--red-text)}
    .pnfo{background:var(--panel);border:1px solid var(--border);color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:32px}
    .mc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;position:relative}
    .mc.up{border-left:4px solid var(--green)}.mc.dn{border-left:4px solid var(--red)}
    .mn{font-size:.95rem;font-weight:700;margin-bottom:10px}
    .pb{display:inline-block;padding:3px 13px;border-radius:999px;font-size:.82rem;font-weight:700;margin-bottom:12px}
    .pbu{background:var(--green-soft);color:var(--green-text);border:1px solid var(--green)}
    .pbd{background:var(--red-soft);color:var(--red-text);border:1px solid var(--red)}
    .ct{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
    .cy{background:var(--green-soft);color:var(--green-text)}.cn{background:var(--red-soft);color:var(--red-text)}
    .mr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .mi{background:var(--panel-2);border-radius:6px;padding:8px 10px}
    .mi .ml{font-size:.68rem;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
    .mi .mv{font-size:.98rem;font-weight:700;color:var(--blue)}
    .cf{margin-top:10px;font-size:.78rem;color:var(--muted)}
    .bb{position:absolute;top:12px;right:12px;background:var(--gold-bg);color:var(--gold);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--gold)}
    .tw{overflow-x:auto;margin-top:8px}
    .st{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px}
    table{width:100%;border-collapse:collapse;font-size:.87rem}
    thead th{background:var(--panel-3);color:var(--muted);text-transform:uppercase;font-size:.7rem;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
    tbody tr{border-bottom:1px solid var(--panel-3)}tbody tr:hover{background:var(--panel)}
    tbody td{padding:10px 14px}
    .tu{color:var(--green-text);font-weight:700}.td{color:var(--red-text);font-weight:700}
    .ty{color:var(--green-text)}.tn{color:var(--red-text)}
    @media(max-width:640px){
      body{padding-top:76px}
      .theme-toggle{top:16px;right:16px}
    }
  </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme">
  <svg class="moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 14.2A7.8 7.8 0 0 1 9.8 3 9 9 0 1 0 21 14.2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <span id="themeLabel">Dark</span>
</button>
<header>
  <h1>
    <span class="t-icon">
      <svg viewBox="0 0 22 22" fill="none"><path d="M2 5h18M11 5v12" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
    </span>
    StockSense AI
  </h1>
  <p>Select a date and options — ML models will predict the selected market signal</p>
</header>

<div class="card">
  <h2>Select Options</h2>
  <form id="f">
    <div class="row">
      <div class="field">
        <label>Date</label>
        <input type="date" name="date" id="di" required/>
      </div>
      <div class="field">
        <label>Prediction Type</label>
        <select name="type">
          <option value="next_day">Next Day Direction</option>
          <option value="trend">Short-term Trend</option>
          <option value="volatility">High Volatility Day</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Model Focus</label>
        <select name="focus">
          <option value="all">All Models</option>
          <option value="ensemble">Ensemble Only</option>
          <option value="linear">Linear Models</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn" id="sb">Run Prediction</button>
  </form>
  <div class="spinner" id="sp"></div>
  <div class="err" id="em"></div>
</div>

<div id="res">
  <div class="sbar" id="sb2"></div>
  <div class="pills" id="pl"></div>
  <div class="grid" id="gd"></div>
  <div class="tw">
    <div class="st">Full Metrics Comparison</div>
    <table>
      <thead><tr>
        <th>Algorithm</th><th>Prediction</th><th>Correct?</th>
        <th>Confidence</th><th>Accuracy %</th><th>Precision %</th><th>Recall %</th><th>F1 %</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<script>
  const themeToggle=document.getElementById('themeToggle'),
        themeLabel=document.getElementById('themeLabel');
  function setTheme(theme){
    const isLight=theme==='light';
    document.body.classList.toggle('light',isLight);
    themeLabel.textContent=isLight?'Light':'Dark';
    themeToggle.setAttribute('aria-label',`Switch to ${isLight?'dark':'light'} theme`);
    localStorage.setItem('theme',theme);
  }
  setTheme(localStorage.getItem('theme') || 'dark');
  themeToggle.addEventListener('click',()=>setTheme(document.body.classList.contains('light')?'dark':'light'));

  document.getElementById('di').value = '{{ latest_date }}';
  const form=document.getElementById('f'),sp=document.getElementById('sp'),
        btn=document.getElementById('sb'),em=document.getElementById('em');

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    em.style.display='none';
    document.getElementById('res').style.display='none';
    sp.style.display='block'; btn.disabled=true;
    const p={};
    new FormData(form).forEach((v,k)=>p[k]=v);
    try{
      const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
      const d=await r.json();
      if(d.error) throw new Error(d.error);
      render(d.results,d.stock);
    }catch(e){em.textContent='Error: '+e.message;em.style.display='block';}
    finally{sp.style.display='none';btn.disabled=false;}
  });

  function fmt(n){return Number(n).toLocaleString();}

  function render(results,stock){
    const isPositive=stock.actual===stock.positive_label;
    document.getElementById('sb2').innerHTML=`
      <div class="chip"><div class="cl">Date</div><div class="cv">${stock.date}</div></div>
      <div class="chip"><div class="cl">Open</div><div class="cv">$${stock.open}</div></div>
      <div class="chip"><div class="cl">High</div><div class="cv">$${stock.high}</div></div>
      <div class="chip"><div class="cl">Low</div><div class="cv">$${stock.low}</div></div>
      <div class="chip"><div class="cl">Close</div><div class="cv">$${stock.close}</div></div>
      <div class="chip"><div class="cl">Volume</div><div class="cv">${fmt(stock.volume)}</div></div>
      <div class="chip ${isPositive?'up':'dn'}"><div class="cl">${stock.actual_label}</div><div class="cv">${isPositive?'&#8593;':'&#8595;'} ${stock.actual}</div></div>`;

    const uc=results.filter(r=>r.prediction===1).length,
          cc=results.filter(r=>r.correct).length,
          best=results[0];
    document.getElementById('pl').innerHTML=`
      <span class="pill pnfo">${stock.prediction_type}</span>
      <span class="pill pup">&#8593; ${stock.positive_label}: ${uc} models</span>
      <span class="pill pdn">&#8595; ${stock.negative_label}: ${results.length-uc} models</span>
      <span class="pill pnfo">&#10003; Correct: ${cc}/${results.length}</span>
      <span class="pill pnfo">&#9733; Best: ${best.name} (${best.accuracy}%)</span>`;

    document.getElementById('gd').innerHTML=results.map((r,i)=>`
      <div class="mc ${r.prediction===1?'up':'dn'}">
        ${i===0?'<span class="bb">&#9733; Best</span>':''}
        <div class="mn">${r.name}</div>
        <div>
          <span class="pb ${r.prediction===1?'pbu':'pbd'}">${r.prediction===1?'&#8593;':'&#8595;'} ${r.label}</span>
          <span class="ct ${r.correct?'cy':'cn'}">${r.correct?'&#10003; Correct':'&#10007; Wrong'}</span>
        </div>
        <div class="mr">
          <div class="mi"><div class="ml">Accuracy</div><div class="mv">${r.accuracy}%</div></div>
          <div class="mi"><div class="ml">Precision</div><div class="mv">${r.precision}%</div></div>
          <div class="mi"><div class="ml">Recall</div><div class="mv">${r.recall}%</div></div>
          <div class="mi"><div class="ml">F1-Score</div><div class="mv">${r.f1}%</div></div>
        </div>
        ${r.confidence!==null?`<div class="cf">Confidence: ${r.confidence}%</div>`:''}
      </div>`).join('');

    document.getElementById('tb').innerHTML=results.map(r=>`
      <tr>
        <td>${r.name}</td>
        <td class="${r.prediction===1?'tu':'td'}">${r.prediction===1?'&#8593;':'&#8595;'} ${r.label}</td>
        <td class="${r.correct?'ty':'tn'}">${r.correct?'&#10003;':'&#10007;'}</td>
        <td>${r.confidence!==null?r.confidence+'%':'&mdash;'}</td>
        <td>${r.accuracy}%</td><td>${r.precision}%</td><td>${r.recall}%</td><td>${r.f1}%</td>
      </tr>`).join('');

    document.getElementById('res').style.display='block';
    document.getElementById('res').scrollIntoView({behavior:'smooth'});
  }
</script>
</body>
</html>
